; NanoVNA Remote for the Adafruit ESP32-S3 Reverse TFT Feather (product 5691)
[platformio]
default_envs = feather

[env:feather]
platform = espressif32@6.11.0  ; pinned: a newer platform (ESP-IDF) can break the build; update on purpose
board = adafruit_feather_esp32s3_reversetft
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
extra_scripts =
    pre:tools/embed_client.py

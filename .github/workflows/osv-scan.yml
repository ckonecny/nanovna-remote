name: Dependency vulnerabilities

# Scans the npm lockfiles against the OSV database.

on:
  push:
    branches: [main]
    paths:
      - 'client/package-lock.json'
      - 'dev-tools/screenshots/package-lock.json'
  pull_request:
    paths:
      - 'client/package-lock.json'
      - 'dev-tools/screenshots/package-lock.json'
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install osv-scanner
        run: |
          base=https://github.com/google/osv-scanner/releases/download/v1.9.2
          curl -sSfL -o osv-scanner "$base/osv-scanner_linux_amd64"
          curl -sSfL -o SHA256SUMS "$base/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' SHA256SUMS | sed 's/osv-scanner_linux_amd64$/osv-scanner/' | sha256sum -c -
          chmod +x osv-scanner
      - name: Scan the lockfiles
        run: ./osv-scanner --lockfile=client/package-lock.json --lockfile=dev-tools/screenshots/package-lock.json

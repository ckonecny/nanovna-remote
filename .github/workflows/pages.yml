name: Feature page

# Publishes the feature page (site/) and the live demo (the web app with a simulated NanoVNA, under /demo/) to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'client/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build the demo
        working-directory: client
        run: |
          npm ci
          npm run build:demo
      - name: Assemble the site
        run: |
          cp -r site _site
          cp -r client/dist-demo _site/demo
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

name: Feature page

# Publishes the feature page (site/), the live demo (the web app with a simulated NanoVNA, under /demo/) and the browser
# installer (/install/, flashes the latest release) to GitHub Pages. A new release starts this workflow (see release.yml).
on:
  push:
    branches: [main]
    paths: ['site/**', 'client/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build the demo
        working-directory: client
        run: |
          npm ci
          npm run build:demo
      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp -r site _site
          cp -r client/dist-demo _site/demo
          # the browser installer flashes the first-flash image of the latest release (same origin, so no CORS trouble)
          tag=$(gh release view --json tagName --jq .tagName)
          gh release download "$tag" --pattern '*-first-flash.bin' --output _site/install/firmware.bin
          printf '{"name":"NanoVNA Remote","version":"%s","new_install_prompt_erase":false,"builds":[{"chipFamily":"ESP32-S3","parts":[{"path":"firmware.bin","offset":0}]}]}\n' "${tag#v}" > _site/install/manifest.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

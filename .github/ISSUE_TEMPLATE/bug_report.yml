name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
  - type: input
    id: versions
    attributes:
      label: Firmware commit, browser, NanoVNA model
